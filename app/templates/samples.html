{% extends "base.html" %}{% block content %}
<div class="page-heading"><div><p class="eyebrow">SAMPLES</p><h1>样例清单</h1></div><a class="button" href="/api/export/csv">下载 CSV</a></div>
<section class="panel table-wrap"><table><thead><tr><th>ID</th><th>场景</th><th>任务链路</th><th>结论</th><th></th></tr></thead><tbody>{% for sample in samples %}<tr><td>{{ sample.sample_id }}</td><td>{{ sample.scenario_type }}</td><td>{{ sample.task_types|join(' / ') }}</td><td><span class="status">{{ sample.final_conclusion }}</span></td><td><a href="/samples/{{ sample.sample_id }}">查看</a></td></tr>{% else %}<tr><td colspan="5" class="muted">暂无样例</td></tr>{% endfor %}</tbody></table></section>
{% endblock %}
